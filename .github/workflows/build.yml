# 统一构建工作流 - Windows + macOS + Linux 三平台自动构建发布
# 触发：推送 main 分支 / 推送 Tag / 手动触发
# 发布：仅在推送 Tag 时自动发布到 GitHub Release 使用 RELEASE.md 作为发布说明

name: 🚀 自动构建发布 (Windows + macOS + Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================== Windows 构建 ====================
  build-windows:
    name: 🪟 Windows 构建
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 1. 拉取项目源码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2.1 读取版本号
        shell: pwsh
        run: |
          echo "TAG_NAME=${{ github.ref_name }}" >> $env:GITHUB_ENV

      # ======== pip 缓存优化 (提速 50%+）========
      - name: 缓存 Python 依赖包
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install PyQt5 PyQt-Fluent-Widgets requests pyinstaller

      - name: 3.5 下载 UPX 压缩工具
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          Move-Item upx-4.2.4-win64\upx.exe .

      - name: 4. PyInstaller 打包
        run: |
          pyinstaller `
            --name "OCCM_${{ env.TAG_NAME }}" `
            --onefile `
            --windowed `
            --noconsole `
            --upx-dir . `
            --add-data "assets;assets" `
            --add-data "locales;locales" `
            --hidden-import qfluentwidgets `
            --hidden-import qfluentwidgets.widgets `
            --hidden-import qfluentwidgets.components `
            --hidden-import qfluentwidgets.common `
            --hidden-import qfluentwidgets.window `
            --hidden-import requests `
            --hidden-import urllib3 `
            --hidden-import certifi `
            --hidden-import charset_normalizer `
            --hidden-import idna `
            --collect-data qfluentwidgets `
            --collect-submodules qfluentwidgets `
            --exclude-module torch `
            --exclude-module tensorflow `
            --exclude-module scipy `
            --exclude-module matplotlib `
            --exclude-module pandas `
            --exclude-module numpy `
            --exclude-module PIL `
            --exclude-module IPython `
            --exclude-module jedi `
            --exclude-module zmq `
            --exclude-module lxml `
            --exclude-module cryptography `
            --exclude-module pyarrow `
            --exclude-module numba `
            --exclude-module llvmlite `
            --exclude-module sqlalchemy `
            --exclude-module openpyxl `
            --exclude-module pytest `
            --exclude-module pygments `
            --exclude-module psutil `
            --icon "assets/icon.ico" `
            --noconfirm `
            --clean `
            opencode_config_manager_fluent.py

      - name: 5. 重命名 exe 文件
        run: |
          cd dist
          Rename-Item "OCCM_${{ env.TAG_NAME }}.exe" "OCCM_${{ env.TAG_NAME }}-Windows-x64.exe"

      - name: 6. 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/OCCM_${{ env.TAG_NAME }}-Windows-x64.exe

  # ==================== macOS 构建 ====================
  build-macos:
    name: 🍎 macOS 构建
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 1. 拉取项目源码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2.1 读取版本号
        run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      # ======== pip 缓存优化 (提速 50%+）========
      - name: 缓存 Python 依赖包
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 3. 安装 PyQt5 + qfluentwidgets 依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel -i https://pypi.tuna.tsinghua.edu.cn/simple
          python3 -m pip install PyQt5-qt5 PyQt5-sip PyQt5 requests --force-reinstall -i https://pypi.tuna.tsinghua.edu.cn/simple
          python3 -m pip install pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple
          # macOS ARM64 没有 qfluentwidgets 预编译包 从 GitHub 源码安装
          python3 -m pip install git+https://github.com/zhiyiYo/PyQt-Fluent-Widgets.git --no-cache-dir

      - name: 4. PyInstaller 打包
        run: |
          pyinstaller \
            --name "OCCM_${{ env.TAG_NAME }}" \
            --onedir \
            --windowed \
            --noconsole \
            --add-data "assets:assets" \
            --add-data "locales:locales" \
            --icon "assets/icon.icns" \
            --hidden-import=qfluentwidgets \
            --hidden-import=qfluentwidgets.widgets \
            --hidden-import=qfluentwidgets.components \
            --hidden-import=qfluentwidgets.common \
            --hidden-import=qfluentwidgets.window \
            --hidden-import=requests \
            --hidden-import=urllib3 \
            --hidden-import=certifi \
            --hidden-import=charset_normalizer \
            --hidden-import=idna \
            --collect-data qfluentwidgets \
            --collect-data PyQt5 \
            --exclude-module PyQt5.QtBluetooth \
            --exclude-module PyQt5.QtNfc \
            --exclude-module PyQt5.QtPositioning \
            --exclude-module PyQt5.QtGamepad \
            --noconfirm \
            --strip \
            opencode_config_manager_fluent.py
        shell: /bin/bash -e {0}
        env:
          pythonLocation: /Users/runner/hostedtoolcache/Python/3.11.11/arm64
          PKG_CONFIG_PATH: /Users/runner/hostedtoolcache/Python/3.11.11/arm64/lib/pkgconfig
          Python_ROOT_DIR: /Users/runner/hostedtoolcache/Python/3.11.11/arm64
          Python2_ROOT_DIR: /Users/runner/hostedtoolcache/Python/3.11.11/arm64
          Python3_ROOT_DIR: /Users/runner/hostedtoolcache/Python/3.11.11/arm64

      - name: 5. 清理扩展属性 + 签名 .app 包 (使用 entitlements)
        run: |
          # 清理 macOS 扩展属性 彻底解决「文件已损坏」警告
          xattr -cr dist/OCCM_${{ env.TAG_NAME }}.app
          # 使用 entitlements.plist 进行签名 (支持 macOS 15.5 + M4 芯片)
          codesign --force --deep --sign - --entitlements entitlements.plist dist/OCCM_${{ env.TAG_NAME }}.app
          # 验证签名是否成功
          codesign -vvv dist/OCCM_${{ env.TAG_NAME }}.app
        shell: /bin/bash -e {0}

      - name: 6. 打包 DMG 镜像 (包含自动安装脚本)
        run: |
          # 安装 create-dmg 已存在则跳过
          brew install create-dmg || true
          
          # 创建 DMG 内容目录
          mkdir -p dmg_contents
          
          # 复制 .app
          cp -R "dist/OCCM_${{ env.TAG_NAME }}.app" dmg_contents/
          
          # 创建安装脚本启动器
          cat > dmg_contents/安装.command << 'EOFINSTALL'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./install_update.sh
          EOFINSTALL
          chmod +x dmg_contents/安装.command
          
          # 复制安装脚本
          cp install_update.sh dmg_contents/
          chmod +x dmg_contents/install_update.sh
          
          # 复制诊断脚本
          cp diagnose_macos.sh dmg_contents/
          chmod +x dmg_contents/diagnose_macos.sh
          
          # 创建 README
          cat > dmg_contents/README.txt << 'EOFREADME'
          OCCM - OpenCode Config Manager
          
          安装方法:
          1. 双击"安装.command"自动安装 (推荐)
          2. 或手动拖拽 OCCM.app 到应用程序文件夹
          
          如果遇到"应用已损坏"或无法启动:
          1. 打开终端
          2. 运行: xattr -cr /Applications/OCCM.app
          3. 重新启动应用
          
          诊断工具:
          - 双击 diagnose_macos.sh 运行诊断
          
          更多帮助: https://github.com/icysaintdx/OpenCode-Config-Manager
          EOFREADME
          
          # 删除旧的 dmg 包 避免冲突
          rm -rf dist/OCCM_${{ env.TAG_NAME }}.dmg
          
          # 生成 Mac 标准带拖拽引导的 DMG 镜像
          create-dmg \
            --volname "OCCM ${{ env.TAG_NAME }}" \
            --window-size 800 500 \
            --icon-size 100 \
            --icon "OCCM_${{ env.TAG_NAME }}.app" 200 200 \
            --app-drop-link 600 200 \
            --hide-extension "OCCM_${{ env.TAG_NAME }}.app" \
            --volicon "assets/icon.icns" \
            --no-internet-enable \
            "dist/OCCM_${{ env.TAG_NAME }}.dmg" \
            "dmg_contents/"
        shell: /bin/bash -e {0}

      - name: 7. 签名 DMG 文件 (修复签名失效问题)
        run: |
          # 签名 DMG 文件本身 防止 create-dmg 破坏签名
          codesign --force --sign - "dist/OCCM_${{ env.TAG_NAME }}.dmg"
          # 验证 DMG 签名
          codesign -vvv "dist/OCCM_${{ env.TAG_NAME }}.dmg" || echo "DMG 签名验证完成"
        shell: /bin/bash -e {0}

      - name: 8. 打包 ZIP 版本 (解压即用 + 包含安装脚本)
        run: |
          cd dist
          
          # 创建包含完整工具的目录结构
          mkdir -p "OCCM_${{ env.TAG_NAME }}-macOS"
          
          # 复制应用本体
          cp -R "OCCM_${{ env.TAG_NAME }}.app" "OCCM_${{ env.TAG_NAME }}-macOS/"
          
          # 复制安装脚本
          cp ../install_update.sh "OCCM_${{ env.TAG_NAME }}-macOS/"
          chmod +x "OCCM_${{ env.TAG_NAME }}-macOS/install_update.sh"
          
          # 复制诊断脚本
          cp ../diagnose_macos.sh "OCCM_${{ env.TAG_NAME }}-macOS/"
          chmod +x "OCCM_${{ env.TAG_NAME }}-macOS/diagnose_macos.sh"
          
          # 创建安装启动器
          cat > "OCCM_${{ env.TAG_NAME }}-macOS/安装.command" << 'EOFINSTALL'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./install_update.sh
          EOFINSTALL
          chmod +x "OCCM_${{ env.TAG_NAME }}-macOS/安装.command"
          
          # 复制 README
          cat > "OCCM_${{ env.TAG_NAME }}-macOS/README.txt" << 'EOFREADME'
          OCCM - OpenCode Config Manager
          
          安装方法:
          1. 双击"安装.command"自动安装 (推荐)
          2. 或手动拖拽 OCCM.app 到应用程序文件夹
          
          如果遇到"应用已损坏"或无法启动:
          1. 打开终端
          2. 运行: xattr -cr /Applications/OCCM.app
          3. 重新启动应用
          
          诊断工具:
          - 双击 diagnose_macos.sh 运行诊断
          
          更多帮助: https://github.com/icysaintdx/OpenCode-Config-Manager
          EOFREADME
          
          # 打包为 ZIP
          zip -r "OCCM_${{ env.TAG_NAME }}-macOS.zip" "OCCM_${{ env.TAG_NAME }}-macOS/"
          
          # 清理临时目录
          rm -rf "OCCM_${{ env.TAG_NAME }}-macOS"
        shell: /bin/bash -e {0}

      - name: 9. 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/OCCM_${{ env.TAG_NAME }}.dmg
            dist/OCCM_${{ env.TAG_NAME }}-macOS.zip

  # ==================== Linux 构建 ====================
  build-linux:
    name: 🐧 Linux 构建
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 1. 拉取项目源码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: 2.1 读取版本号
        run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      # ======== pip 缓存优化 (提速 50%+）========
      - name: 缓存 Python 依赖包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 3. 安装系统依赖
        run: |
          sudo apt update -y && sudo apt install -y \
            python3-pyqt5 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            python3-dev \
            build-essential \
            pyqt5-dev-tools \
            git \
            libxcb-randr0-dev libxcb-xtest0-dev \
            fuse libfuse2 \
            file

      - name: 4. 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip setuptools wheel -i https://pypi.tuna.tsinghua.edu.cn/simple
          python3 -m pip install pyinstaller PyQt5==5.15.10 requests --force-reinstall --no-cache-dir -i https://pypi.tuna.tsinghua.edu.cn/simple
          python3 -m pip install git+https://github.com/zhiyiYo/PyQt-Fluent-Widgets.git --no-cache-dir

      - name: 5. PyInstaller 打包
        run: |
          pyinstaller \
            --name "OCCM_${{ env.TAG_NAME }}" \
            --onedir \
            --windowed \
            --noconsole \
            --hidden-import=qfluentwidgets \
            --hidden-import=qfluentwidgets.widgets \
            --hidden-import=qfluentwidgets.components \
            --hidden-import=qfluentwidgets.common \
            --hidden-import=qfluentwidgets.window \
            --hidden-import=requests \
            --hidden-import=urllib3 \
            --hidden-import=certifi \
            --hidden-import=charset_normalizer \
            --hidden-import=idna \
            --collect-data qfluentwidgets \
            --collect-data PyQt5 \
            --exclude-module PyQt5.QtBluetooth \
            --exclude-module PyQt5.QtNfc \
            --exclude-module PyQt5.QtPositioning \
            --exclude-module PyQt5.QtGamepad \
            --noconfirm \
            --strip \
            --add-data "assets:assets" \
            --add-data "locales:locales" \
            opencode_config_manager_fluent.py
        shell: /bin/bash -e {0}

      - name: 6. 打包成 tar.gz
        run: |
          cd dist
          rm -f OCCM_${{ env.TAG_NAME }}-Linux-x64.tar.gz
          tar -zcvf OCCM_${{ env.TAG_NAME }}-Linux-x64.tar.gz OCCM_${{ env.TAG_NAME }}/
        shell: /bin/bash -e {0}

      - name: 7. 创建 AppImage (单文件可执行)
        run: |
          # 下载 appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          
          # 创建 AppDir 结构
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # 复制应用文件
          cp -r dist/OCCM_${{ env.TAG_NAME }}/* AppDir/usr/bin/
          
          # 创建启动脚本
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          # 使用通配符匹配可执行文件（避免硬编码版本号）
          exec "${HERE}/usr/bin/"OCCM_* "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # 创建 .desktop 文件
          cat > AppDir/OCCM.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=OCCM
          Comment=OpenCode Config Manager
          Exec=OCCM_${{ env.TAG_NAME }}
          Icon=occm
          Categories=Development;Utility;
          Terminal=false
          EOF
          cp AppDir/OCCM.desktop AppDir/usr/share/applications/
          
          # 复制图标 (如果存在)
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/occm.png
            cp assets/icon.png AppDir/occm.png
          else
            # 创建一个简单的占位图标
            echo "No icon found, using placeholder"
            touch AppDir/occm.png
          fi
          
          # 打包 AppImage
          ARCH=x86_64 ./appimagetool AppDir "dist/OCCM_${{ env.TAG_NAME }}-Linux-x86_64.AppImage"
        shell: /bin/bash -e {0}

      - name: 8. 创建 DEB 包 (Debian/Ubuntu)
        run: |
          # 安装 fpm
          sudo gem install fpm
          
          # 创建符号链接脚本 (安装后执行)
          cat > postinst << 'EOFPOSTINST'
          #!/bin/bash
          # 创建符号链接到 /usr/local/bin
          ln -sf /opt/occm/OCCM_* /usr/local/bin/occm
          EOFPOSTINST
          chmod +x postinst
          
          # 创建 deb 包
          fpm -s dir -t deb \
            --name occm \
            --version "${{ env.TAG_NAME }}" \
            --description "OpenCode Config Manager - 可视化管理 OpenCode 配置" \
            --maintainer "IcySaint <icysaintdx@github.com>" \
            --url "https://github.com/icysaintdx/OpenCode-Config-Manager" \
            --license "MIT" \
            --architecture amd64 \
            --depends "libxcb-xinerama0" \
            --depends "libxcb-cursor0" \
            --depends "libxcb-randr0" \
            --depends "libxcb-xtest0" \
            --depends "libxcb-shape0" \
            --depends "libxcb-xfixes0" \
            --depends "libgl1" \
            --depends "libglib2.0-0" \
            --depends "libxkbcommon-x11-0" \
            --depends "libfontconfig1" \
            --depends "libfreetype6" \
            --after-install postinst \
            --package "dist/OCCM_${{ env.TAG_NAME }}-Linux-amd64.deb" \
            "dist/OCCM_${{ env.TAG_NAME }}/=/opt/occm" \
            "AppDir/OCCM.desktop=/usr/share/applications/occm.desktop"
        shell: /bin/bash -e {0}

      - name: 9. 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/OCCM_${{ env.TAG_NAME }}-Linux-x64.tar.gz
            dist/OCCM_${{ env.TAG_NAME }}-Linux-x86_64.AppImage
            dist/OCCM_${{ env.TAG_NAME }}-Linux-amd64.deb

  # ==================== Web Windows 构建 ====================
  build-web-windows:
    name: 🪟 Web Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 读取版本号
        shell: pwsh
        run: echo "TAG_NAME=${{ github.ref_name }}" >> $env:GITHUB_ENV
      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-web-${{ hashFiles('requirements_web.txt') }}
          restore-keys: ${{ runner.os }}-pip-web-
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install nicegui requests bcrypt PyJWT paramiko pyinstaller
      - name: 下载 UPX
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          Move-Item upx-4.2.4-win64\upx.exe .
      - name: PyInstaller 打包
        run: |
          pyinstaller `
            --name "OCCM_Web_${{ env.TAG_NAME }}" `
            --onefile --console --upx-dir . `
            --add-data "occm_web;occm_web" `
            --add-data "occm_core;occm_core" `
            --add-data "locales;locales" `
            --hidden-import nicegui --hidden-import nicegui.elements `
            --hidden-import nicegui.ui --hidden-import uvicorn `
            --hidden-import starlette --hidden-import fastapi `
            --hidden-import httptools --hidden-import websockets `
            --hidden-import requests --hidden-import urllib3 --hidden-import certifi `
            --hidden-import bcrypt --hidden-import jwt --hidden-import paramiko `
            --collect-data nicegui --collect-submodules nicegui `
            --exclude-module torch --exclude-module tensorflow `
            --exclude-module scipy --exclude-module matplotlib `
            --exclude-module pandas --exclude-module numpy `
            --exclude-module PIL --exclude-module IPython `
            --exclude-module pytest --exclude-module PyQt5 `
            --exclude-module qfluentwidgets `
            --icon "assets/icon.ico" --noconfirm --clean `
            occm_web_launcher.py
      - name: 重命名
        run: |
          cd dist
          Rename-Item "OCCM_Web_${{ env.TAG_NAME }}.exe" "OCCM_Web_${{ env.TAG_NAME }}-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: web-windows-build
          path: dist/OCCM_Web_${{ env.TAG_NAME }}-Windows-x64.exe

  # ==================== Web macOS 构建 ====================
  build-web-macos:
    name: 🍎 Web macOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 读取版本号
        run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-web-${{ hashFiles('requirements_web.txt') }}
          restore-keys: ${{ runner.os }}-pip-web-
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install nicegui requests bcrypt PyJWT paramiko pyinstaller
      - name: PyInstaller 打包
        run: |
          pyinstaller \
            --name "OCCM_Web_${{ env.TAG_NAME }}" \
            --onedir --console \
            --add-data "occm_web:occm_web" \
            --add-data "occm_core:occm_core" \
            --add-data "locales:locales" \
            --hidden-import=nicegui --hidden-import=nicegui.elements \
            --hidden-import=nicegui.ui --hidden-import=uvicorn \
            --hidden-import=starlette --hidden-import=fastapi \
            --hidden-import=httptools --hidden-import=websockets \
            --hidden-import=requests --hidden-import=urllib3 --hidden-import=certifi \
            --hidden-import=bcrypt --hidden-import=jwt --hidden-import=paramiko \
            --collect-data nicegui --collect-submodules nicegui \
            --exclude-module torch --exclude-module tensorflow \
            --exclude-module scipy --exclude-module matplotlib \
            --exclude-module pandas --exclude-module numpy \
            --exclude-module PIL --exclude-module IPython \
            --exclude-module pytest --exclude-module PyQt5 \
            --exclude-module qfluentwidgets \
            --noconfirm --strip \
            occm_web_launcher.py
      - name: 打包 ZIP
        run: |
          cd dist
          zip -r "OCCM_Web_${{ env.TAG_NAME }}-macOS.zip" "OCCM_Web_${{ env.TAG_NAME }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: web-macos-build
          path: dist/OCCM_Web_${{ env.TAG_NAME }}-macOS.zip

  # ==================== Web Linux 构建 ====================
  build-web-linux:
    name: 🐧 Web Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: 读取版本号
        run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-web-${{ hashFiles('requirements_web.txt') }}
          restore-keys: ${{ runner.os }}-pip-web-
      - name: 安装系统依赖
        run: sudo apt update -y && sudo apt install -y libgl1 libglib2.0-0 fuse libfuse2 file
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install nicegui requests bcrypt PyJWT paramiko pyinstaller
      - name: PyInstaller 打包
        run: |
          pyinstaller \
            --name "OCCM_Web_${{ env.TAG_NAME }}" \
            --onedir --console \
            --add-data "occm_web:occm_web" \
            --add-data "occm_core:occm_core" \
            --add-data "locales:locales" \
            --hidden-import=nicegui --hidden-import=nicegui.elements \
            --hidden-import=nicegui.ui --hidden-import=uvicorn \
            --hidden-import=starlette --hidden-import=fastapi \
            --hidden-import=httptools --hidden-import=websockets \
            --hidden-import=requests --hidden-import=urllib3 --hidden-import=certifi \
            --collect-data nicegui --collect-submodules nicegui \
            --exclude-module torch --exclude-module tensorflow \
            --exclude-module scipy --exclude-module matplotlib \
            --exclude-module pandas --exclude-module numpy \
            --exclude-module PIL --exclude-module IPython \
            --exclude-module pytest --exclude-module PyQt5 \
            --exclude-module qfluentwidgets \
            --noconfirm --strip \
            occm_web_launcher.py
      - name: 打包 tar.gz
        run: |
          cd dist
          tar -zcvf "OCCM_Web_${{ env.TAG_NAME }}-Linux-x64.tar.gz" "OCCM_Web_${{ env.TAG_NAME }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: web-linux-build
          path: dist/OCCM_Web_${{ env.TAG_NAME }}-Linux-x64.tar.gz

  # ==================== 统一发布 ====================
  release:
    name: 📦 发布到 GitHub Release
    needs: [build-windows, build-macos, build-linux, build-web-windows, build-web-macos, build-web-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 拉取项目源码 (获取 RELEASE.md）
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./dist
      - uses: actions/download-artifact@v4
        with:
          name: web-windows-build
          path: ./dist
      - uses: actions/download-artifact@v4
        with:
          name: web-macos-build
          path: ./dist
      - uses: actions/download-artifact@v4
        with:
          name: web-linux-build
          path: ./dist

      - name: 列出所有构建产物
        run: ls -la ./dist/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/*.exe
            ./dist/*.dmg
            ./dist/*.zip
            ./dist/*-Linux-x64.tar.gz
            ./dist/*.AppImage
            ./dist/*.deb
          overwrite_files: true
          body_path: ./RELEASE.md
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
